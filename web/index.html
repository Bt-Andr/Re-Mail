<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Certains CDN d'emails bloquent le chargement d'image si le Referer pointe vers
         un domaine tiers (protection anti-hotlink) — no-referrer évite ce blocage pour
         les images distantes intégrées dans le corps des mails affichés. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Re-mail" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Re-Mail</title>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
